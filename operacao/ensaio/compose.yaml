# Ensaio local da produção, por cima do compose da VPS, para subir o mesmo arquivo que vai ao ar e
# rodar os mesmos scripts: operacao/vps/compose.sh com CAIXA_SIMPLES_COMPOSE_ADICIONAL apontando para
# este arquivo, e a configuração e o estado em pastas fora do repositório, a configuração gerada por
# operacao/vps/criar-configuracao.sh. O passo a passo está em operacao/README.md. Os caminhos
# relativos valem a partir da pasta do primeiro arquivo, a da VPS.
#
# O que muda em relação à produção: as imagens são construídas deste checkout; a CPU é dividida com
# soma de uma, o pior caso de a vCPU da máquina ser disputada; o proxy atende em outras portas, com o
# domínio localhost e a autoridade local dele; as cópias e as remoções vão para volumes do Docker no
# lugar do S3; e há um PostgreSQL vazio para a restauração.
name: caixa-simples-ensaio

services:
  proxy:
    cpus: 0.1
    ports: !override
      - "18080:80"
      - "18443:443"

  app:
    build: ../..
    image: caixa-simples:ensaio
    cpus: 0.6

  banco:
    cpus: 0.3

  seed:
    image: caixa-simples:ensaio
    cpus: 0.6

  # As cópias ficam num volume do Docker, e não numa pasta do projeto: mesmo cifradas, não têm por que
  # ficar ao alcance de um commit. As duas pastas fazem o papel dos dois destinos do bucket.
  copia:
    build:
      context: ..
      dockerfile: copia/Dockerfile
    image: caixa-simples-copia:ensaio
    cpus: 0.1
    volumes:
      - copias:/copias

  restaurado:
    profiles: [restauracao]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurado
      POSTGRES_USER: restaurado
      POSTGRES_PASSWORD: ${CAIXA_SIMPLES_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurado -d restaurado"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sem -e CAIXA_SIMPLES_RESTAURAR_BANCO, restaura no banco do ensaio, como na recriação da máquina;
  # com ele apontando para o restaurado, no PostgreSQL vazio ao lado.
  restaurar:
    image: caixa-simples-copia:ensaio
    depends_on:
      restaurado:
        condition: service_healthy
    volumes:
      - copias:/copias:ro
      - remocoes:/remocoes:ro

  encerrar:
    image: caixa-simples-copia:ensaio
    volumes:
      - remocoes:/remocoes

volumes:
  copias:
  remocoes:
