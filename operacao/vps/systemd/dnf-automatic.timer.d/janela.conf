# A atualização automática de segurança pode reiniciar a máquina, então ela roda dentro da janela de
# manutenção (3h às 8h UTC): às 7h30 UTC, depois da cópia diária das 6h e longe da hora cheia, quando
# sai a cópia de hora em hora. A linha vazia apaga o horário de fábrica antes do novo. Sem atraso
# aleatório, que a empurraria para fora da janela, e sem recuperar a execução perdida com a máquina
# desligada, que rodaria no boot, a qualquer hora.
[Timer]
OnCalendar=
OnCalendar=*-*-* 07:30:00 UTC
RandomizedDelaySec=0
Persistent=false
