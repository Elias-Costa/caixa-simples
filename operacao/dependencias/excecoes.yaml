# Exceções fundamentadas aos avisos que barrariam a publicação, lidas por verificar.sh.
#
# Cada exceção diz qual aviso, em que pacote, por que ele não alcança o que é publicado ou por que
# esperar é aceitável, e até quando vale. A data de revisão fica no máximo 90 dias à frente do dia em
# que a exceção entra; vencida, a ferramenta volta a barrar o aviso até alguém revisar. A
# justificativa é pública, como o resto do repositório.
#
# Formato de cada exceção:
#
#   - id: CVE-2026-00000
#     purls:
#       - pkg:npm/pacote@1.2.3
#     statement: Por que o aviso não alcança o que é publicado, ou o que falta para corrigi-lo.
#     expired_at: 2026-12-31
#
# O purl, com o tipo, o nome e a versão do pacote, sai no relatório da ferramenta em JSON. Sem
# purls, a exceção valeria para o mesmo aviso em qualquer pacote, e por isso ele é obrigatório aqui.
# Pelo mesmo motivo, a troca de uma base muda o purl, com a versão do pacote e a do Alpine, e a
# exceção que continua precisa ganhar o purl novo na mesma troca.
vulnerabilities:
  # O proxy da VPS, o Caddy 2.11.9, traz o golang.org/x/net 0.60.0, cujo leitor de HTML entra pela
  # biblioteca de linha de comando da smallstep, que monta a ajuda dos comandos. A correção está na
  # 0.62.0, e esta exceção sai com um build do proxy com a 0.62.0 ou mais nova.
  - id: CVE-2026-78661
    purls:
      - pkg:golang/golang.org/x/net@v0.60.0
    statement: >-
      Custo quadrático de CPU e de memória ao ler um HTML com muitos trechos curtos de texto separados
      por marcas de fim ignoradas. No proxy, o leitor de HTML só serve à ajuda dos comandos da linha de
      comando. Ao atender, o proxy limita o tamanho do corpo e encaminha a requisição à aplicação sem
      interpretar o conteúdo dela nem o da resposta, que ele no máximo comprime.
    expired_at: 2026-12-01

  # A base da imagem da cópia e da imagem do banco da VPS, o postgres 17 sobre o Alpine 3.24.2, traz a
  # musl 1.2.6-r2, a zlib 1.3.2-r0, a krb5-libs 1.22.2-r1 e a libxslt 1.1.43-r3. As correções estão na
  # musl 1.2.6-r3, na zlib 1.3.2-r1, na krb5-libs 1.22.3-r0 e na libxslt 1.1.43-r4. A base de
  # 2026-11-05 corrige só as duas primeiras; a de 2026-11-12 da mesma tag, com o PostgreSQL 17.12 sobre
  # o Alpine 3.24.4, corrige as quatro e entra depois de 7 dias publicada, como toda troca de base.
  # Trocado o digest nos dois Dockerfiles juntos, todas as exceções deste bloco saem.
  - id: CVE-2026-107891
    purls:
      - pkg:apk/alpine/musl@1.2.6-r2?arch=x86_64&distro=3.24.2
      - pkg:apk/alpine/musl-utils@1.2.6-r2?arch=x86_64&distro=3.24.2
    statement: >-
      Estouro de inteiro com escrita fora do buffer ao compilar, com regcomp, uma expressão regular não
      confiável. O PostgreSQL usa o próprio leitor de expressões regulares, e não o da biblioteca C.
      Nas duas imagens, só o shell, o busybox, a biblioteca do Kerberos e a libedit chamam o regcomp,
      com as expressões escritas nos scripts ou na configuração da própria imagem; nenhuma expressão
      vem de dado.
    expired_at: 2026-12-01
  - id: CVE-2026-85091
    purls:
      - pkg:apk/alpine/zlib@1.3.2-r0?arch=x86_64&distro=3.24.2
    statement: >-
      Escrita além do buffer em gzprintf e gzvprintf, depois de uma escrita travada num descritor não
      bloqueante. Nenhum programa das duas imagens chama essas funções: o pg_dump, o pg_restore e a
      libxml2 escrevem pelo gzwrite, que não passa pelo trecho com a falha.
    expired_at: 2026-12-01

  # Na krb5-libs, a maior parte dos avisos é do KDC e do kadmind, os servidores do Kerberos, que vêm em
  # outro pacote e não estão nas duas imagens. Das bibliotecas, só a do GSSAPI é usada: pelo servidor
  # do PostgreSQL, que a imagem da cópia não sobe, e pelo libpq. O banco não tem keytab, o pg_hba não
  # tem linha gss, e a porta dele não é publicada: só os contêineres da rede interna da VPS chegam a
  # ela, a aplicação e os jobs da cópia e da manutenção.
  - id: CVE-2026-107364
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Leitura além do buffer no KDC, com um pedido sem autenticação. O KDC não está nas imagens da cópia
      e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-119079
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Custo quadrático de CPU no KDC ao decodificar um pedido de ticket com muitos elementos numa lista.
      O KDC não está nas imagens da cópia e do banco, e nenhum programa delas recebe pedido de ticket.
    expired_at: 2026-12-01
  - id: CVE-2026-71200
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Ponteiro nulo no KDC configurado para autenticar por PKINIT. O KDC não está nas imagens da cópia e
      do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-71199
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Indicadores de autenticação forjados num ticket, que o KDC ou o serviço que o recebe aceitariam.
      O KDC não está nas imagens da cópia e do banco, e o banco não aceita ticket do Kerberos: não tem
      keytab nem linha gss no pg_hba.
    expired_at: 2026-12-01
  - id: CVE-2026-112317
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Vazamento de memória no KDC e no kadmind ao falhar a decifração da chave do keytab. Nenhum dos dois
      está nas imagens da cópia e do banco, e o banco não tem keytab.
    expired_at: 2026-12-01
  - id: CVE-2026-112315
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Vazamento de memória no kadmind com mensagens RPCSEC_GSS malformadas. O kadmind não está nas
      imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112316
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Vazamento de memória no kadmind ao falhar a decodificação de um pedido autenticado. O kadmind não
      está nas imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112318
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Queda do kadmind com um pedido de política de nome vazio. O kadmind não está nas imagens da cópia e
      do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112319
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Consumo de memória ou de CPU no kadmind, sem limite de tamanho ao decodificar um pedido RPC. O
      kadmind não está nas imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112320
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Consumo de memória no kadmind ao abrir e abandonar contextos GSS na mesma conexão. O kadmind não
      está nas imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112321
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Consumo de memória no kadmind com pedidos AUTH_GSSAPI_INIT que falham. O kadmind não está nas
      imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112322
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Custo quadrático de CPU no kadmind ao limpar a lista de clientes AUTH_GSSAPI. O kadmind não está
      nas imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-112323
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Consumo de memória no kadmind, que guarda por 15 minutos o estado de cada AUTH_GSSAPI_INIT que
      falha. O kadmind não está nas imagens da cópia e do banco.
    expired_at: 2026-12-01
  - id: CVE-2026-118380
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Alteração, por quem está no caminho da rede, dos argumentos de uma chamada RPC protegida por
      RPCSEC_GSS. Só as ferramentas de administração do Kerberos usam esse RPC, e nenhuma delas está nas
      imagens da cópia e do banco; nenhum programa delas usa a biblioteca do RPC.
    expired_at: 2026-12-01
  - id: CVE-2026-40355
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Ponteiro nulo ao aceitar um contexto GSSAPI com o mecanismo NegoEx registrado em /etc/gss/mech.
      Nas imagens da cópia e do banco essa pasta não existe e nenhum mecanismo extra está registrado.
    expired_at: 2026-12-01
  - id: CVE-2026-40356
    purls:
      - pkg:apk/alpine/krb5-libs@1.22.2-r1?arch=x86_64&distro=3.24.2
    statement: >-
      Leitura fora do buffer ao aceitar um contexto GSSAPI com o mecanismo NegoEx registrado em
      /etc/gss/mech. Nas imagens da cópia e do banco essa pasta não existe e nenhum mecanismo extra está
      registrado.
    expired_at: 2026-12-01

  # Na libxslt, os avisos vêm do navegador Chromium, que traz a mesma biblioteca, e valem para quem
  # aplica uma folha de estilo XSLT a um documento vindo de fora. Nas duas imagens, só a extensão xml2
  # do PostgreSQL e a ferramenta xsltproc carregam a biblioteca.
  - id: CVE-2026-9947
    purls:
      - pkg:apk/alpine/libxslt@1.1.43-r3?arch=x86_64&distro=3.24.2
    statement: >-
      Uso de memória já liberada ao processar XML. A extensão xml2 não é criada no banco: nenhuma
      migration a cria, e só um superusuário poderia, enquanto o papel da aplicação não é superusuário.
      Nenhum script das imagens chama o xsltproc.
    expired_at: 2026-12-01
  - id: CVE-2026-87636
    purls:
      - pkg:apk/alpine/libxslt@1.1.43-r3?arch=x86_64&distro=3.24.2
    statement: >-
      Confusão de tipo ao processar XML. A extensão xml2 não é criada no banco: nenhuma migration a cria,
      e só um superusuário poderia, enquanto o papel da aplicação não é superusuário. Nenhum script das
      imagens chama o xsltproc.
    expired_at: 2026-12-01
  - id: CVE-2026-125350
    purls:
      - pkg:apk/alpine/libxslt@1.1.43-r3?arch=x86_64&distro=3.24.2
    statement: >-
      Uso de memória já liberada ao processar XML. A extensão xml2 não é criada no banco: nenhuma
      migration a cria, e só um superusuário poderia, enquanto o papel da aplicação não é superusuário.
      Nenhum script das imagens chama o xsltproc.
    expired_at: 2026-12-01
