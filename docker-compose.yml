services:
  postgres:
    image: postgres:17-alpine
    container_name: ecrx-caixa-db
    environment:
      POSTGRES_DB: ${ECRX_CAIXA_DB_NAME:-ecrx_caixa}
      POSTGRES_USER: ${ECRX_CAIXA_DB_USER:-ecrx_caixa}
      POSTGRES_PASSWORD: ${ECRX_CAIXA_DB_PASSWORD:-ecrx_caixa}
    ports:
      - "${ECRX_CAIXA_DB_PORT:-5432}:5432"
    volumes:
      - ecrx-caixa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECRX_CAIXA_DB_USER:-ecrx_caixa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ecrx-caixa-pgdata:
