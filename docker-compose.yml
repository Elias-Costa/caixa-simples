services:
  postgres:
    image: postgres:17-alpine
    container_name: caixa-simples-db
    environment:
      POSTGRES_DB: ${CAIXA_SIMPLES_DB_NAME:-caixa_simples}
      POSTGRES_USER: ${CAIXA_SIMPLES_DB_USER:-caixa_simples}
      POSTGRES_PASSWORD: ${CAIXA_SIMPLES_DB_PASSWORD:-caixa_simples}
    ports:
      - "${CAIXA_SIMPLES_DB_PORT:-5432}:5432"
    volumes:
      - caixa-simples-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAIXA_SIMPLES_DB_USER:-caixa_simples}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  caixa-simples-pgdata:
