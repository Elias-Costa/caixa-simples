services:
  postgres:
    image: postgres:17-alpine
    container_name: fechadia-db
    environment:
      POSTGRES_DB: ${FECHADIA_DB_NAME:-fechadia}
      POSTGRES_USER: ${FECHADIA_DB_USER:-fechadia}
      POSTGRES_PASSWORD: ${FECHADIA_DB_PASSWORD:-fechadia}
    ports:
      - "${FECHADIA_DB_PORT:-5432}:5432"
    volumes:
      - fechadia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FECHADIA_DB_USER:-fechadia}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fechadia-pgdata:
