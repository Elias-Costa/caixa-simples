spring:
  application:
    name: caixa-simples

  # Arquitetura §8: carga I/O-bound (banco, chamadas a PSP), nao CPU-bound.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${CAIXA_SIMPLES_DB_URL:jdbc:postgresql://localhost:5432/caixa_simples}
    username: ${CAIXA_SIMPLES_DB_USER:caixa_simples}
    password: ${CAIXA_SIMPLES_DB_PASSWORD:caixa_simples}

  jpa:
    # O schema pertence ao Flyway. O Hibernate so confere se bate.
    hibernate:
      ddl-auto: validate
    # Evita LazyInitializationException mascarada por sessao aberta na view.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

caixa-simples:
  jwt:
    # Sem valor padrao de proposito (D14e): um padrao em codigo seria o mesmo em toda instalacao,
    # o que equivale a nao ter chave. A aplicacao nao sobe sem esta variavel.
    # Precisa de ao menos 32 bytes (HMAC-SHA256).
    secret: ${CAIXA_SIMPLES_JWT_SECRET}
    # 24h contadas do ultimo contato com o servidor, nao do login (A4): toda resposta autenticada
    # devolve um token novo. Na pratica e a janela de resistencia offline exigida pelo RNF01.
    validade: 24h

server:
  port: ${CAIXA_SIMPLES_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    br.com.caixasimples: INFO
