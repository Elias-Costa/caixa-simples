# Portão entre o push e a produção: a hospedagem só publica o commit em que este workflow passou.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo ramo torna a execução anterior inútil: o que vai ser publicado é o último
# commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, build e lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A suíte Java sobe o PostgreSQL em contêiner pelo Docker do executor. O empacotamento baixa
      # o Node fixado no pom.xml e roda os testes e o build do front-end. O wrapper vai pelo sh
      # porque não tem o bit de execução no repositório.
      - name: Testes Java, testes do front-end e build do jar
        run: sh mvnw -B -ntp verify

      # Com o mesmo Node que o empacotamento acabou de baixar, em vez de um segundo, instalado à
      # parte.
      - name: Lint do front-end
        working-directory: frontend
        run: PATH="$PWD/node:$PATH" npm run lint
