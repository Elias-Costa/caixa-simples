# Portão entre o push e a produção: só vai ao ar o commit em que os testes, o build e o lint
# passaram e nenhuma dependência tem aviso de segurança que barre a publicação.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Um aviso novo pode surgir para uma dependência que não mudou. Uma vez por semana, só a
    # verificação das dependências roda contra o main, sem publicar; a falha da execução agendada é
    # avisada pelo GitHub a quem mexeu por último nesta agenda.
    - cron: '17 9 * * 1'
    # Toda madrugada, às 3h UTC, 0h no fuso America/Bahia e começo da janela de manutenção, o deploy
    # do último commit aprovado, se ele ainda não estiver no ar. A troca para a aplicação por uns
    # 40 s, e uma requisição em andamento nesse instante volta com erro: de dia, ninguém fica
    # exposto a isso sem querer.
    - cron: '0 3 * * *'
  # O mesmo deploy, na hora, para uma correção urgente, aceitando o erro raro da troca.
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo ramo torna a execução anterior inútil: o que vai ser publicado é o último
# commit. O evento e a agenda entram no grupo para uma execução agendada não cancelar a de um push,
# nem a verificação semanal cancelar o deploy da madrugada.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, build e lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A suíte Java sobe o PostgreSQL em contêiner pelo Docker do executor. O empacotamento baixa
      # o Node fixado no pom.xml e roda os testes e o build do front-end. O wrapper vai pelo sh
      # porque não tem o bit de execução no repositório.
      - name: Testes Java, testes do front-end e build do jar
        run: sh mvnw -B -ntp verify

      # Com o mesmo Node que o empacotamento acabou de baixar, em vez de um segundo, instalado à
      # parte.
      - name: Lint do front-end
        working-directory: frontend
        run: PATH="$PWD/node:$PATH" npm run lint

      # O script que gera o código de ativação dos pedidos de plano confere o mesmo vetor fixo que a
      # suíte Java confere na aplicação: se os dois divergissem, o código entregue seria recusado.
      - name: Teste do script do código de plano
        run: PATH="$PWD/frontend/node:$PATH" node --test operacao/plano/codigo.test.mjs

  # Avisos de segurança das dependências: as duas imagens construídas deste commit, as imagens de
  # terceiros que rodam na VPS e o package-lock do front-end, pelo mesmo script que se roda na
  # máquina. Fica num job à parte, sem segredo nenhum, porque a ferramenta é de terceiro e roda com
  # acesso ao Docker do executor.
  dependencias:
    name: Avisos de segurança das dependências
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
      || github.event.schedule == '17 9 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verificação das dependências e das imagens
        run: sh operacao/dependencias/verificar.sh

  # Constrói as duas imagens deste commit e as publica no registro de contêineres do GitHub, com o
  # token da própria execução, que só vale enquanto ela dura e só publica nos pacotes deste
  # repositório. As imagens são públicas, como o código. Não põe nada no ar: quem faz isso é o job
  # implantar. A variável do repositório liga a publicação; sem ela, o CI testa e não publica, que é
  # o caso enquanto não existe a VPS.
  publicar:
    name: Publicação das imagens
    needs: [verificar, dependencias]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLICAR_NA_VPS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Construção e publicação das imagens deste commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          registro="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --pull --tag "$registro:$GITHUB_SHA" .
          docker build --pull --tag "$registro-copia:$GITHUB_SHA" --file operacao/copia/Dockerfile operacao
          docker push "$registro:$GITHUB_SHA"
          docker push "$registro-copia:$GITHUB_SHA"

  # Põe no ar o último commit cuja execução de push passou inteira, publicação das imagens
  # inclusive. O único segredo guardado é a chave SSH, que na VPS só roda o script de deploy, e o
  # script só aceita um commit que já esteja no main; commit com migration ou que muda o compose da
  # VPS ele só aceita na janela de manutenção, inclusive pelo botão.
  implantar:
    name: Deploy na VPS
    if: >-
      (github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch')
      && vars.PUBLICAR_NA_VPS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Último commit aprovado
        id: aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "$sha" ]; then
            echo "::error::Nenhuma execução de push no main passou inteira."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Deploy deste commit
        env:
          CHAVE: ${{ secrets.VPS_CHAVE_DE_IMPLANTACAO }}
          CHAVE_DO_HOST: ${{ vars.VPS_CHAVE_DO_HOST }}
          ENDERECO: ${{ vars.VPS_ENDERECO }}
          SHA: ${{ steps.aprovado.outputs.sha }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$CHAVE_DO_HOST" ] || [ -z "$ENDERECO" ]; then
            echo "::error::O deploy está ligado, mas falta o segredo VPS_CHAVE_DE_IMPLANTACAO ou as variáveis VPS_CHAVE_DO_HOST e VPS_ENDERECO."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/implantacao
          chmod 600 ~/.ssh/implantacao
          # A chave do host fica fixada: um servidor que se passasse pela VPS não receberia a conexão.
          printf '%s %s\n' "$ENDERECO" "$CHAVE_DO_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/implantacao -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "implantacao@$ENDERECO" "$SHA"
